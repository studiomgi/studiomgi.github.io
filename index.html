<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HUB · Studio MGI</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="HUB MGI">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F1F4F8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
:root{--bg:#F1F4F8;--card:rgba(255,255,255,.86);--ink:#1E2A4A;--soft:#4A5470;--mute:#5C6579;--line:#E6E9EF;--navy:#273869;
--tt:#111111;--ttb:#ECECEC;--ig:#C1357A;--igb:#FBE8F1;--yt:#D9261C;--ytb:#FDE9E7;--ok:#1B6B3A;--okb:#E5F4EB;--warn:#A4510B;--warnb:#FFF1E2}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:radial-gradient(900px 380px at 65% -60px,#C9D4E6 0%,rgba(201,212,230,0) 70%),var(--bg);min-height:100vh}
.wrap{max-width:1240px;margin:0 auto;padding:32px 28px 60px;display:flex;flex-direction:column;gap:22px}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:44px;height:44px;border-radius:22px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600}
.brand small{display:block;font-size:12px;color:var(--mute)}
.brand strong{font-weight:500;font-size:15px}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.7);padding:4px;border-radius:24px}
.tabs button{min-height:40px;padding:0 18px;border-radius:20px;border:0;background:transparent;color:var(--soft);font:inherit;font-size:13px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--navy);color:#fff}
.pill{display:inline-block;font-size:13px;padding:8px 16px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--soft)}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
h1{margin:14px 0 0;font-weight:300;font-size:clamp(34px,5vw,56px);line-height:1.08;color:var(--soft)}
h1 b{font-weight:600;color:var(--navy)}
.hero p{max-width:340px;margin:0;font-size:14px;line-height:1.6;color:var(--soft)}
.alert{padding:14px 18px;border-radius:16px;font-size:14px;font-weight:500}
.alert.ok{background:var(--okb);color:var(--ok)}
.alert.warn{background:var(--warnb);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:0 8px 30px rgba(39,56,105,.05)}
.kpi{display:flex;flex-direction:column;gap:8px}
.kpi .top{display:flex;justify-content:space-between;align-items:center}
.kpi h3{margin:6px 0 0;font-weight:400;font-size:19px}
.kpi .detail{font-size:13px;color:var(--mute)}
.kpi .num{display:flex;align-items:baseline;gap:6px;margin-top:18px}
.kpi .num span:first-child{font-weight:300;font-size:50px;line-height:1}
.kpi .num span:last-child{font-size:12px;color:var(--mute)}
.bar{height:22px;border-radius:11px;background:#EEF1F5;overflow:hidden}
.bar i{display:block;height:100%;border-radius:11px}
.tag{font-size:12px;font-weight:500;padding:4px 10px;border-radius:10px;white-space:nowrap}
.TikTok{background:var(--ttb);color:var(--tt)}.Instagram{background:var(--igb);color:var(--ig)}.YouTube{background:var(--ytb);color:var(--yt)}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:14px}
h2{margin:0 0 10px;font-weight:500;font-size:16px}
.row{display:grid;grid-template-columns:64px 1fr auto auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #EEF1F5;font-size:14px}
.row:last-child{border-bottom:0}
.status{font-size:12px;font-weight:500;color:var(--ok)}
.status.publié{color:var(--navy)}
.status.échec{color:var(--warn)}
.up{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#F5F7FA;margin-bottom:10px;font-size:14px}
.up b{font-weight:500;min-width:84px}
footer{font-size:12px;color:var(--mute);text-align:center}
@media (max-width:760px){.wrap{padding:22px 16px 40px}.grid2{grid-template-columns:1fr}.row{grid-template-columns:52px 1fr auto}.row .st{grid-column:2/4}.hero p{max-width:none}}
</style>
</head>
<body>
<div id="gate" style="display:none;position:fixed;inset:0;background:var(--bg);z-index:9;align-items:center;justify-content:center">
<form id="gf" style="background:#fff;border-radius:22px;padding:28px;display:flex;flex-direction:column;gap:12px;width:300px;box-shadow:0 8px 30px rgba(39,56,105,.08)">
<strong style="font-weight:600;font-size:18px">HUB Studio MGI</strong>
<label for="pw" style="font-size:13px;color:var(--mute)">Mot de passe</label>
<input id="pw" type="password" autocomplete="current-password" style="min-height:44px;border-radius:12px;border:1px solid var(--line);padding:0 12px;font:inherit">
<button style="min-height:44px;border-radius:22px;border:0;background:var(--navy);color:#fff;font:inherit;cursor:pointer">Entrer</button>
<span id="gerr" style="font-size:12px;color:var(--warn)"></span>
</form></div>
<div class="wrap">
<header>
<div class="brand"><div class="logo">M</div><div><small id="date"></small><strong>HUB Studio MGI</strong></div></div>
<div class="tabs" role="tablist" id="tabs"></div>
</header>
<section class="hero">
<div><span class="pill" id="report"></span><h1 id="title"></h1></div>
<p id="summary"></p>
</section>
<div id="alerts"></div>
<section class="grid2">
<div class="card"><h2>Planning du jour</h2><div id="today"></div></div>
<div class="card"><h2>À venir</h2><div id="upcoming"></div></div>
</section>
<section class="kpis" id="kpis"></section>
<section class="grid2">
<div class="card"><h2>Vues sur 7 jours</h2><div id="legend" style="display:flex;gap:14px;font-size:12px;color:var(--mute);margin-bottom:8px"></div><div id="chart"></div></div>
<div class="card"><h2>Engagement (7 jours)</h2><div id="eng" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"></div></div>
</section>

<section class="card" id="kwcard" style="display:none"><h2>Hashtags & tags</h2>
<p id="kwrule" style="font-size:13px;color:var(--mute);margin:0 0 12px"></p>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong style="font-weight:500;font-size:14px">Hashtags (Instagram, TikTok, YouTube)</strong><button data-copy="kwh" style="min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;cursor:pointer">Copier</button></div>
<p id="kwh" style="font-size:14px;line-height:1.7;color:var(--navy);margin:8px 0 18px"></p>
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><strong style="font-weight:500;font-size:14px">Tags YouTube (séparés par des virgules)</strong><button data-copy="kwt" style="min-height:40px;padding:0 16px;border-radius:20px;border:1px solid var(--line);background:#fff;font:inherit;font-size:13px;cursor:pointer">Copier</button></div>
<p id="kwt" style="font-size:14px;line-height:1.7;color:var(--soft);margin:8px 0 0"></p>
</section>
<footer id="updated"></footer>
</div>
<script>
const COL={TikTok:'#111111',Instagram:'#C1357A',YouTube:'#D9261C'};
let data,cur='piv';
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function chart(c){
 const t=c.trend, el=document.getElementById('chart'), lg=document.getElementById('legend');
 if(!t||!t.labels||!t.labels.length){el.innerHTML='<p style="font-size:13px;color:var(--mute);margin:24px 0">La courbe s\'affichera dès les premières statistiques.</p>';lg.innerHTML='';return}
 const W=640,H=200,P=28,n=t.labels.length,keys=Object.keys(t.series).filter(k=>t.series[k]&&t.series[k].some(v=>v!=null));
 const max=Math.max(1,...keys.flatMap(k=>t.series[k].filter(v=>v!=null)));
 const x=i=>P+(W-2*P)*(n<2?0.5:i/(n-1)), y=v=>H-P-(H-2*P)*(v/max);
 let g='';for(let j=0;j<=3;j++){const yy=P+(H-2*P)*j/3;g+=`<line x1="${P}" x2="${W-P}" y1="${yy}" y2="${yy}" stroke="#E6E9EF"/><text x="2" y="${yy+4}" font-size="10" fill="#5C6579">${Math.round(max*(1-j/3))}</text>`}
 t.labels.forEach((l,i)=>g+=`<text x="${x(i)}" y="${H-6}" font-size="10" fill="#5C6579" text-anchor="middle">${esc(l)}</text>`);
 keys.forEach(k=>{const pts=t.series[k].map((v,i)=>v==null?null:[x(i),y(v)]).filter(Boolean);g+=`<polyline fill="none" stroke="${COL[k]}" stroke-width="2.2" points="${pts.map(p=>p.join(',')).join(' ')}"/>`+pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" fill="#fff" stroke="${COL[k]}" stroke-width="2"/>`).join('')});
 el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Vues par jour sur 7 jours">${g}</svg>`;
 lg.innerHTML=keys.map(k=>`<span><i style="display:inline-block;width:10px;height:10px;border-radius:5px;background:${COL[k]};margin-right:6px"></i>${k}</span>`).join('');
}
function eng(c){
 const e=c.engagement||{}, f=(v)=>v==null?'—':Number(v).toLocaleString('fr-FR');
 const items=[['Likes',e.likes],['Commentaires',e.comments],['Partages',e.shares],['Nouveaux abonnés',e.followers_gain]];
 document.getElementById('eng').innerHTML=items.map(([l,v])=>`<div style="background:#F5F7FA;border-radius:16px;padding:14px"><div style="font-size:12px;color:var(--mute)">${l}</div><div style="font-weight:300;font-size:30px;margin-top:6px">${f(v)}</div></div>`).join('')+(c.best_time?`<div style="grid-column:1/3;font-size:13px;color:var(--soft)">Meilleur créneau observé : <b style="font-weight:600;color:var(--navy)">${esc(c.best_time)}</b></div>`:'');
}

function liveStatus(t){
 if(t.status!=='programmé')return t.status;
 const today=new Date(data.updated).toDateString()===new Date().toDateString();
 if(!today)return t.status;
 const [h,m]=t.time.split(':').map(Number),n=new Date();
 return (n.getHours()*60+n.getMinutes())>=(h*60+m+5)?'publié':'programmé';
}
function kw(){
 const k=(data.keywords||{})[cur],box=document.getElementById('kwcard');
 if(!k){box.style.display='none';return} box.style.display='block';
 document.getElementById('kwrule').textContent=k.rule;document.getElementById('kwh').textContent=k.hashtags;document.getElementById('kwt').textContent=k.tags;
 box.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard.writeText(document.getElementById(b.dataset.copy).textContent).then(()=>{b.textContent='Copié ✓';setTimeout(()=>b.textContent='Copier',1500)})});
}
function render(){
 const c=data.channels[cur];
 document.getElementById('tabs').innerHTML=Object.entries(data.channels).map(([k,v])=>`<button role="tab" aria-selected="${k===cur}" data-k="${k}">${esc(v.name)}</button>`).join('');
 document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{cur=b.dataset.k;render()});
 document.getElementById('date').textContent=data.date_label;
 document.getElementById('report').textContent='Rapport du '+data.date_label.toLowerCase();
 document.getElementById('title').innerHTML=esc(c.headline[0])+'<br><b>'+esc(c.headline[1])+'</b>';
 document.getElementById('summary').textContent=c.summary;
 const al=data.alerts||[];
 document.getElementById('alerts').innerHTML=al.length?al.map(a=>`<div class="alert warn">Action requise : ${esc(a)}</div>`).join(''):'<div class="alert ok">✓ Aucune action requise aujourd\'hui</div>';
 const k=c.kpis.map(x=>`<div class="card kpi"><div class="top"><span class="tag ${x.platform}">${x.platform}</span></div><h3>${esc(x.label)}</h3><span class="detail">${esc(x.detail)}</span><div class="num"><span>${x.value==null?'—':x.value.toLocaleString('fr-FR')}</span><span>/ ${esc(x.unit)}</span></div><div class="bar"><i style="width:${Math.round((x.bar||0)*100)}%;background:repeating-linear-gradient(115deg,${COL[x.platform]} 0 2px,transparent 2px 6px)"></i></div></div>`);
 const f=c.followers;
 k.push(`<div class="card kpi"><div class="top"><span class="tag" style="background:#E8ECF4;color:#273869">Communauté</span></div><h3>${esc(f.label)}</h3><span class="detail">Objectif ${f.goal.toLocaleString('fr-FR')}</span><div class="num"><span>${f.value==null?'—':f.value.toLocaleString('fr-FR')}</span><span>/ ${f.goal.toLocaleString('fr-FR')}</span></div><div class="bar"><i style="width:${f.value?Math.max(2,Math.round(f.value/f.goal*100)):0}%;background:repeating-linear-gradient(115deg,#273869 0 2px,transparent 2px 6px)"></i></div></div>`);
 document.getElementById('kpis').innerHTML=k.join('');
 chart(c);eng(c);kw();
 document.getElementById('today').innerHTML=c.today.map(t=>`<div class="row"><b style="font-weight:500">${esc(t.time)}</b><span>${esc(t.title)}</span><span class="tag ${t.platform}">${t.platform}</span>${(st=>`<span class="st status ${esc(st)}">● ${esc(st)}</span>`)(liveStatus(t))}</div>`).join('');
 document.getElementById('upcoming').innerHTML=c.upcoming.map(u=>`<div class="up"><b>${esc(u.day)}</b><span>${esc(u.text)}</span></div>`).join('');
 document.getElementById('updated').textContent='Mis à jour le '+new Date(data.updated).toLocaleString('fr-FR',{dateStyle:'long',timeStyle:'short'});
}
const HASH='07949f49ae2384c34ca7d5470e5df851ece481869440028d6189237785bf0bda';
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function load(){fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{data=d;render()}).catch(()=>{document.getElementById('summary').textContent='Données indisponibles pour le moment.'})}
(function(){let ok=!HASH;try{ok=ok||localStorage.getItem('hub_ok')===HASH}catch(e){}
 if(ok){load();return}
 const g=document.getElementById('gate');g.style.display='flex';
 document.getElementById('gf').onsubmit=async ev=>{ev.preventDefault();
  if(await sha(document.getElementById('pw').value)===HASH){try{localStorage.setItem('hub_ok',HASH)}catch(e){}g.style.display='none';load()}
  else document.getElementById('gerr').textContent='Mot de passe incorrect.'};
})();
</script>
</body>
</html>
